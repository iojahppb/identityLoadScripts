httpConnection:
  maxPersistentConnectionsPerHost: 6
  maxConnectedHosts: 30
  maxRedirectDepth: 10
  keepAliveTimeout: 60
  connectTimeout: 120
  abruptClose: false
  requestTimeout: 120

proxy:
  usePAC: false
  pacAddress: ""
  useProxy: false
  proxyServer: ""
  proxyDomain: ""
  proxyUser: ""
  proxyPassword: ""
  proxyAuthenticationType: ""
  excludedHosts: []

ssl:
  disableHTTP2: false
  disableHTTP3: true
  ignoreBadCertificate: false
  tlsMaxVersion: tls12

replay:
  simulateNewUser: false
  saveSnapshots: "never"
  useCache: false
  enableDynatrace: false
  resourceHttpErrorAsWarning: true

vts:
  useProxy: false
  proxyServer: ""
  proxyUser: ""
  proxyPassword: ""

encryption:
  keyLocation: ""

vuserLogger:
  maxBufferSize: 0
  logMode: full
  logLevel: error
  showInConsole: false

flow:
  enabled: true
  initialize:
    items:
      - name: "vuser_init"

  run:
    logic: "sequential"
    items:
      - name: 'main loop'
        logic: 'sequential'
        loop: 1
        items:
          - name: "Identity SSO View Recover Password"
          - name: "Clear Cookies"

  finalize:
    items:

thinkTime:
  type: 'asRecorded'
  limit: -1

userArguments:
  THINK_TIME: "1"
  DOMAIN: ".betfair.com"

